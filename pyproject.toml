[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-ai"
version = "0.1.0"
description = "AI-Assisted Application Security Platform for Pull Request Analysis"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    # Alembic manages ONLY schema versioning/migrations (Persistence_Strategy.md).
    # It pulls in SQLAlchemy Core internally to connect and run migration scripts,
    # but no ORM is used to encapsulate the T1-T3 transactions themselves -- those
    # are executed with the stdlib sqlite3 module directly (see infrastructure/*/sqlite/).
    "alembic>=1.13",
    # Real runtime HTTP client for the GitHub adapter (infrastructure/core/github/) --
    # not just a test dependency from Phase 4 onward.
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
