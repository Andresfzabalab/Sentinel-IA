[alembic]
script_location = scripts/migrations
prepend_sys_path = .

# sqlalchemy.url is deliberately left blank here -- scripts/migrations/env.py
# sets it at runtime from the DATABASE_PATH environment variable
# (Configuration_and_Secrets.md), never a value committed to this file.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
